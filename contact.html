<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataLens Studio | Contacto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">DataLens Studio</div>

        <button class="hamburger" id="hamburger-btn" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links" id="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="services.html">Servicios</a></li>
            <li><a href="contact.html">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <form action="">
            <fieldset>
                <legend>Formulario de Diagnóstico Inicial</legend>

                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" required name="name" minlength="5">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" required id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="empresa">Nombre del negocio</label>
                    <input type="text" id="empresa" name="empresa" required>
                </div>

                <div class="form-group">
                    <label for="datos">Estado actual de datos</label>
                    <select name="datos" id="datos">
                        <option value="hojas">Solo hojas de cálculo</option>
                        <option value="basica">Base de datos básica</option>
                        <option value="multiples">Múltiples sistemas desarticulados</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Servicio de interés</label>
                    <div class="radio-group">
                        <label for="auditoria">
                            <input type="radio" id="auditoria" name="interes" value="auditoria" checked>
                            Auditoría
                        </label>
                        <label for="dash">
                            <input type="radio" id="dash" name="interes" value="dash">
                            Dashboard BI
                        </label>
                        <label for="predictivos">
                            <input type="radio" id="predictivos" name="interes" value="predictivos">
                            Modelos Predictivos
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="comentarios">Comentarios adicionales</label>
                    <textarea name="comentarios" id="comentarios" cols="30" rows="5"></textarea>
                </div>

                <div class="form-group">
                    <label for="city">Ciudad</label>
                    <input type="text" id="city" name="city" required>
                </div>

                <div class="form-group">
                    <label for="schedule">Horario de atención</label>
                    <input type="text" id="schedule" name="schedule" required>
                </div>

                <div class="form-group">
                    <label for="github">GitHub profile</label>
                    <input type="url" required id="github" name="github">
                </div>

                <button type="submit">Guardar</button>
            </fieldset>
        </form>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 DataLens Studio. Todos los derechos reservados.</p>
    </footer>

    <script src="js/functions.js"></script>
</body>
</html>
